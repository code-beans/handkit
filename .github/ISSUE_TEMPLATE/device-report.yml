name: Device report
description: Results of running the Handkit demo and input self-test on a handheld.
title: "Device report: <device> / <firmware>"
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Failing runs are as useful as passing ones. [CONTRIBUTING.md](https://github.com/code-beans/handkit/blob/main/CONTRIBUTING.md#report-a-device-result) explains how to build and run both programs.
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Anbernic RG35XX H
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware and version
      placeholder: e.g. knulli scarab 2026/08/19, muOS 2601.1, NextUI 6.4
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Handkit version or commit
      placeholder: e.g. v0.4.0 or d7eb606
    validations:
      required: true
  - type: textarea
    id: input-check
    attributes:
      label: Input self-test output
      description: Full output of `./sdk-input-check`.
      render: text
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Demo smoke test output
      description: Full output of `./app --smoke`, run inside the `SDL3 Demo.pak` folder. It includes the GPU driver, renderer and controller found.
      render: text
    validations:
      required: true
  - type: dropdown
    id: buttons
    attributes:
      label: Do the buttons match their printed labels?
      description: In the demo, X and Y switch modes; in the 3D mode, A pauses and B resets the cube.
      options:
        - "Yes"
        - Partly (details below)
        - "No"
        - Didn't check
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: A sideways or garbled picture, wrong colors, missing modes, rumble or LEDs, how you launched the demo.
